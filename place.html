<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The beautiful island of Malta - WDD131</title>
    <meta name="description" content="A illustrative page of Malta and some country's information.">
    <meta name="author" content="Sofia Angela Suarez">
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <script src="scripts/place.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>
<body>
    <header>
        <h1>Malta</h1>
    </header>
    <main>
        <div class="hero">
            <picture>
                <source media="(min-width: 1000px)" srcset="images/malta-hero-large.webp">
                <source media="(min-width: 500px)" srcset="images/malta-hero-medium.webp">
                <img src="images/malta-hero-small.webp" alt="Malta landscape">
            </picture>
        </div>
        <section class="info left">
            <h2>Data</h2>
            <label>Area:</label>
            <p>316 km² (122 sq mi)</p>
            <label>Population:</label>
            <p>519,562 (2021)</p>
            <label>Capital:</label>
            <p>Valletta</p>
            <label>Languages:</label>
            <p>Maltese, English</p>
            <label>Currency:</label>
            <p>Euro (EUR)</p>
            <label>Time Zone:</label>
            <p>UTC+1 (UTC+2 in Summer)</p>
            <label>Calling Code:</label>
            <p>+356</p>
            <label>Internet TLD:</label>
            <p>.mt</p>
        </section>
        <section class="info right">
            <h2>Weather</h2>
            <img src="images/weather_icon.svg" alt="An icon of a cloud with a sun and rain." width="75">
            <label>Temperature:</label>
            <p id="temp">10 °C</p>
            <label>Conditions:</label>
            <p>Sunny</p>
            <label>Wind:</label>
            <p id="wind">16 km/h</p>
            <label>Wind Chill:</label>
            <p id="windChill"></p>
        </section>
    </main>
    <footer>
        <p>© <span id="currentyear"></span> | Sofia Angela Suarez | Argentina</p>
        <p id="lastModified">Last Modification: </p>
    </footer>
</body>
</html>
