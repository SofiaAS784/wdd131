<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="This page allows the user to give a review of a chosen product">
    <meta name="author" content="Sofia Angela Suarez">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="product">Product Name
                <select name="product" id="product" required>
                    <option value="1" selected disabled>Choose a Product ...</option>
                </select>
            </label>
            <div class="rating">
                <div>Overall Rating</div>
                <label for="rating1">☆<input type="radio" id="rating1" name="rating" value="1" required></label>
                <label for="rating2">☆☆<input type="radio" id="rating2" name="rating" value="2" required></label>
                <label for="rating3">☆☆☆<input type="radio" id="rating3" name="rating" value="3" required></label>
                <label for="rating4">☆☆☆☆<input type="radio" id="rating4" name="rating" value="4" required></label>
                <label for="rating5">☆☆☆☆☆<input type="radio" id="rating5" name="rating" value="5" required></label>
            </div>
            <label form="date">Date of Installation <input type="date" id="installDate" name="installDate" required></label>
            <div class="options">
                <div>Which features did you find useful in the product?</div>
                <p>(Check all that apply)</p>
                <label for="durability"><input type="checkbox" id="durability" name="durability" value="yes">Durability</label>
                <label for="use"><input type="checkbox" id="use" name="use" value="yes">Ease of Use</label>
                <label for="performance"><input type="checkbox" id="performance" name="performance" value="yes">Performance</label>
                <label for="design"><input type="checkbox" id="design" name="design" value="yes">Design</label>
            </div>
            <label for="review">Written Review (Optional)
                <textarea name="review" id="review"></textarea></label>
            <label for="username">Your Name (Optional)
                <input type="text" name="username" id="username"></label>
            <input type="submit" value="Send My Review">
        </form>
    </main>
    <footer>
        <p>© <span id="currentyear"></span> | Sofia Angela Suarez | Argentina</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
